<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Felipe">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon2-192.png">
<link rel="apple-touch-icon" href="icon2-192.png">
<title>Plan Felipe Majul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#151517; --surface-2:#1c1c1f; --ink:#f4f2ec; --muted:#8d8d93; --line:#2a2a2e;
  --accent:#ff3b1f; --accent-ink:#ffffff; --chip:#222226; --stripe:repeating-linear-gradient(135deg,#ff3b1f 0 10px,#0b0b0c 10px 20px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0 0 env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;
  background-image:radial-gradient(circle at 50% -20%,#232326 0,transparent 55%)}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.top::before{content:"";display:block;height:6px;margin:-12px -16px 12px;background:var(--stripe)}
.top::after{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg)}
h1{font-family:Anton,"Barlow Condensed",Impact,sans-serif;font-weight:400;font-size:34px;line-height:.95;margin:0 0 12px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 span{color:var(--accent);font-size:15px;letter-spacing:.14em;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 14px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.days button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:400 22px Anton,"Barlow Condensed",sans-serif;text-transform:uppercase;padding:9px 0;border-radius:4px;cursor:pointer;letter-spacing:.04em;position:relative}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:skewX(-6deg)}
.days button[aria-pressed="true"]>*{transform:skewX(6deg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:16px 16px 48px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);overflow:hidden}
.sec h2{margin:0;padding:10px 14px;font-family:Anton,"Barlow Condensed",sans-serif;font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.sec h2 .n{font-size:11px;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--accent);letter-spacing:.14em;border:1px solid var(--accent);padding:2px 6px;margin-left:auto}
.block{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.block+.block{border-top:1px dashed var(--line)}
.block p{margin:0}
.block p.first{font-weight:600;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.03em}
.sets{color:var(--accent);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
a.v,button.v{display:flex;align-items:center;gap:10px;margin-top:6px;padding:11px 12px;background:var(--ink);color:var(--bg);text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
a.v:active{background:var(--accent);color:#fff}
a.v svg{flex:0 0 auto}
a.v small{color:var(--accent);font-weight:700;margin-left:auto;font-size:12px;letter-spacing:.14em}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:8px;text-transform:uppercase;letter-spacing:.14em;font-family:"Barlow Condensed",sans-serif;font-weight:600}
@media (prefers-reduced-motion:no-preference){ main{animation:fade .18s ease} }
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.mode{display:grid;grid-template-columns:1fr 1fr;margin:0 0 12px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mode button{background:var(--chip);color:var(--muted);border:0;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 0;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:#fff}
.days.two{grid-template-columns:1fr 1fr}
.days.two button{font-size:18px;padding:8px 0}
.days.hide{display:none}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum span{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sum span b{color:var(--ink)}
.sec h2 .t{color:var(--accent)}
.meal .main{margin:0;font-size:16px;line-height:1.5}
.meal .main b,.alt b{color:var(--accent);font-weight:700}
.alt{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.alt.o::before{content:"O: ";font-weight:700;color:var(--ink);font-family:"Barlow Condensed",sans-serif;letter-spacing:.06em}
.sec.g{border-left-color:var(--muted)}
.sec.g h2{border-bottom:0;font-size:18px;color:var(--muted)}
table.eq{width:100%;border-collapse:collapse;font-size:14px}
table.eq th,table.eq td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.eq th{color:var(--muted);font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;border-top:0}
table.eq td:first-child{font-weight:600}
h1 b{font-weight:400}
table.eq.c5{table-layout:fixed}
table.eq.c5 th,table.eq.c5 td{padding:8px 5px;font-size:13px}
table.eq.c5 th{font-size:11px;letter-spacing:.04em}
table.eq.c5 th:first-child,table.eq.c5 td:first-child{padding-left:12px;width:26%}
.tip{padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.tip p{margin:0}

button.v{width:100%;border:0;cursor:pointer;text-align:left}
.cf label.h{display:block;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.cf .mseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cf .mseg button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 13px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;padding:10px 0;border-radius:4px;cursor:pointer}
.cf .mseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cf .tg{margin-top:8px;color:var(--muted);font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.cf .tg b{color:var(--ink)}
.cf textarea,.cf input[type=password]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px;font:16px Barlow,sans-serif}
.cf textarea{min-height:110px;resize:vertical}
.cf .ph{display:flex;gap:12px;align-items:center}
.cf .ph label.btn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--muted);padding:11px 14px;border-radius:4px;cursor:pointer;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.cf .ph input{display:none}
.cf .th{position:relative;display:none}
.cf .th img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
.cf .th button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.cf .go{width:100%;border:0;background:var(--accent);color:#fff;font:400 24px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:14px 0;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.cf .go:disabled{opacity:.5;cursor:wait}
.cf .msg{color:var(--muted);font-size:14px;min-height:1em}
.cf .msg.err{color:#ff8a78}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font:14px Barlow,sans-serif;cursor:pointer;padding:0}
.big{font:400 54px/1 Anton,Impact,sans-serif;color:var(--accent)}
.big small{font:700 16px "Barlow Condensed",sans-serif;color:var(--ink);letter-spacing:.08em;margin-left:6px;text-transform:uppercase}
.porc{font-size:17px;font-weight:600}
.bar .bt{display:flex;justify-content:space-between;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.bar .bt span:last-child{color:var(--muted)}
.track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.ok{background:#4fbf6a}
.tip ul{margin:0;padding-left:20px}
.go{display:block;width:100%;border:0;background:var(--accent);color:#fff;font:400 22px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:13px 0;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.go:disabled{opacity:.5;cursor:wait}
main>.go{margin-top:4px}
.done-ok{margin:0;color:#4fbf6a;font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.days button.done span::after{content:" ✓";color:#4fbf6a}
.days button.hoy{box-shadow:inset 0 -3px 0 var(--accent)}
.days button.hoy[aria-pressed="true"]{box-shadow:none}
.log{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.log p{margin:0}
.lg-last{font-size:14px;color:var(--ink)}
.lg-last span{color:var(--muted)}
.lg-today{font-size:14px;color:#4fbf6a}
.lg-today b{color:var(--ink)}
.lg-row{display:flex;gap:6px}
.lg-row input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:15px Barlow,sans-serif}
.lg-row button{border:0;background:var(--ink);color:var(--bg);font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;border-radius:4px;cursor:pointer}
.cf label{display:flex;flex-direction:column;gap:6px;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cf input[type=date],.cf input[type=number],.cf input[type=text],.cf select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font:16px Barlow,sans-serif;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.btn.up{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border:1px dashed var(--muted);padding:11px 14px;border-radius:4px;cursor:pointer;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.msg{margin:0;color:var(--muted);font-size:14px}
.msg.err{color:#ff8a78}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wkb{height:90px;width:100%;display:flex;align-items:flex-end;background:var(--chip);border-radius:4px;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--accent);min-height:2px}
.wk b{font:400 20px Anton,sans-serif}
.wk span{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chk button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--muted);font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 4px;border-radius:4px;cursor:pointer}
.chk button[data-v="plan"][aria-pressed="true"]{background:#1f3a26;border-color:#4fbf6a;color:#bff0c9}
.chk button[data-v="otra"][aria-pressed="true"]{background:#3a2f1a;border-color:#e0a441;color:#ffe1a8}
.chk button[data-v="skip"][aria-pressed="true"]{background:#3a1d1a;border-color:var(--accent);color:#ffc2b8}
.calcd{color:#4fbf6a;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.adj{background:#2a1a12;border:1px solid var(--accent);padding:10px 12px;font-size:14px;line-height:1.45}
.adj span{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:#8d8d93;font:11px Barlow,sans-serif}
.block.row{flex-direction:row;justify-content:space-between;align-items:center}
.shop{flex-direction:row !important;align-items:flex-start;gap:12px;cursor:pointer}
.shop input{margin-top:4px;width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.shop small{color:var(--muted);font-size:13px}
.shop.got b{text-decoration:line-through;color:var(--muted)}
.tp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ta{display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--accent);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:536px;margin:0 auto}
#upd[hidden]{display:none}
#upd button{border:0;background:#fff;color:var(--accent);font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
main{padding-bottom:110px}

.ad{margin-top:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.ad.done{border-color:#2f6b3d}
.ad-top{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;min-height:48px}
.ad-top span{flex:1;font-size:14px;color:var(--muted)}
.ad-top b{color:var(--ink)}
.ad-l{flex:0 1 auto !important;max-width:45%;font:700 14px "Barlow Condensed",sans-serif !important;color:var(--ink) !important;text-transform:uppercase;letter-spacing:.03em}
.ad-ok{color:#4fbf6a !important}
.ad-btn{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:4px;background:var(--accent);color:#fff;font:400 26px/1 Anton,sans-serif;cursor:pointer}
.ad.done .ad-btn{background:var(--chip);color:var(--ink);font-size:18px}
.ad.open .ad-btn{background:var(--chip);color:var(--ink)}
.ad-save{display:block;width:calc(100% - 20px);margin:0 10px 10px;border:0;border-radius:4px;background:var(--accent);color:#fff;font:400 20px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:11px 0;cursor:pointer}
.ad .lnk{display:block;margin:0 auto 10px}

.ad-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ad-row{display:grid;grid-template-columns:30px 1fr 150px;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ad-n{font:400 18px Anton,sans-serif;color:var(--muted);text-align:center}
.ad-t{font:700 16px "Barlow Condensed",sans-serif;color:var(--accent);letter-spacing:.02em}
.ad-st{display:grid;grid-template-columns:36px 1fr 36px;gap:4px}
.ad-st button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:4px;font:700 20px/1 Barlow,sans-serif;cursor:pointer;height:42px}
.ad-st input{width:100%;min-width:0;height:42px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:400 22px Anton,sans-serif;text-align:center}
.ad-st input::placeholder{color:#5d5d63;font:600 14px Barlow,sans-serif}
.ad-st input:focus{outline:2px solid var(--accent);outline-offset:0}
.ad-save{margin-top:10px !important}
.sec.kcal .tip{gap:8px}
.kbig{display:flex;align-items:baseline;gap:8px}
.kbig b{font:400 46px/1 Anton,sans-serif;color:var(--accent)}
.kbig span{font:700 15px "Barlow Condensed",sans-serif;color:var(--muted);letter-spacing:.06em}
.fill.over{background:#e0a441}
.krow{display:flex;flex-wrap:wrap;gap:6px}
.kr{font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;color:var(--muted)}
.kr b{color:var(--ink)}
.kr.off{opacity:.5}
.mode.cmode{margin:0 0 4px}
.mseg.five{grid-template-columns:repeat(5,1fr)}
.mseg.five button{font-size:12px;letter-spacing:0}
.klist{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.kit{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.kit span{color:var(--muted)}
.kit b{color:var(--ink)}
.sec.kcal .v{margin-top:4px}
.sec.rw .tip{gap:12px}
.sec.rw .kbig b{font-size:52px}
.rf{padding:4px 10px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.rtypes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rtypes button{min-width:0;overflow:hidden;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 13px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:10px 0;border-radius:4px;cursor:pointer}
.rtypes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rgrid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.rgrid label{display:flex;flex-direction:column;gap:4px;font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rgrid input,.rnotes{width:100%;min-width:0;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 8px;font:16px Barlow,sans-serif}
.rgrid input[type=text]{font:400 22px Anton,sans-serif;text-align:center}
.rgrid input[type=date]{font-size:14px}
.rf .go{margin:0}
.rl{display:flex;flex-direction:column}
.ri{display:grid;grid-template-columns:44px 1fr 32px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ri-d{text-align:center;line-height:1}
.ri-d b{display:block;font:400 22px Anton,sans-serif}
.ri-d span{font:700 11px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ri-m{display:flex;flex-direction:column;gap:2px;min-width:0}
.ri-m b{font:700 16px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em}
.ri-m span{font-size:13px;color:var(--muted);white-space:normal}
.ri .lnk{text-decoration:none;color:var(--muted);font-size:16px;text-align:center}
.segs{display:flex;flex-direction:column;gap:6px}
.seg-i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.seg-i>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.seg-i b{font:700 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em}
.seg-i span{font-size:13px;color:var(--muted)}
.seg-i .lnk{text-decoration:none;color:var(--muted)}
.seg-t{margin:2px 0 0;font-size:14px;color:var(--muted)}
.seg-t b{color:var(--ink)}
.seg-new{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--muted);border-radius:4px}
.rgrid4{display:grid;grid-template-columns:.8fr 1.3fr 1fr .8fr;gap:6px}
.rgrid4 label{display:flex;flex-direction:column;gap:4px;font:700 10px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rgrid4 input{width:100%;min-width:0;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 4px;font:400 19px Anton,sans-serif;text-align:center}
.rgrid4 input::placeholder{font:500 12px Barlow,sans-serif;color:#5d5d63}

  try { const f = new File([blob], name, {type: 'application/json'}); if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: 'Copia Plan Felipe'}); done = true; } } catch (e) { if (e && e.name === 'AbortError') { BK_MSG = ['Copia cancelada.', false]; return renderMain(); } }

}
async function restoreBackup(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'plan-felipe' || !j.data) throw new Error('Ese archivo no es una copia de esta app.');

    location.reload();

}
function renderImport(){ renderMain(); }

// ---------- running ----------
let RUNS = load('fm-run', []);     // [{id, date, type, km, min, notes}]
function fmtMin(m){ const t = Math.round(m * 60), h = Math.floor(t / 3600), mi = Math.floor((t % 3600) / 60), se = t % 60; return (h ? h + ':' + pad(mi) : mi) + ':' + pad(se); }
function paceStr(min, km){ if (!min || !km) return '—'; const p = min / km, m = Math.floor(p), s = Math.round((p - m) * 60); return `${m}:${pad(s === 60 ? 0 : s)} /km`; }
function parseMin(s){
  s = String(s || '').trim().replace(/[.,;'’]/g, ':').replace(/"/g, '');
  if (!s) return 0;
  if (/^\d+$/.test(s)) { if (s.length <= 2) return Number(s); const sec = Number(s.slice(-2)), rest = s.slice(0, -2); return (rest.length > 2 ? Number(rest.slice(0, -2)) * 60 + Number(rest.slice(-2)) : Number(rest)) + sec / 60; }
  const p = s.split(':').map(x => Number(x) || 0);
  if (p.length === 3) return p[0] * 60 + p[1] + p[2] / 60;
  return p[0] + (p[1] || 0) / 60;
}
let RUN_OPEN = false, RUN_MSG = '';
const SEG_TYPES = ['Calent.', 'Pasadas', 'Continuo', 'Regen.'];
let SEGS = [];   // tramos de la salida que se está cargando: {type, reps, dist, min, rest}
function fmtKm(km){ return (Math.round(km * 100) / 100).toFixed(km % 1 ? (km * 10) % 1 ? 2 : 1 : 0).replace('.', ','); }
function distKm(d){ d = String(d).trim().replace(',', '.'); if (!d) return 0; const m = d.match(/^([\d.]+)\s*(m|mts|k|km)?$/i); if (!m) return Number(d) || 0; const v = Number(m[1]) || 0; return (m[2] && /^m/i.test(m[2])) || (!m[2] && v >= 100) ? v / 1000 : v; }
function segKm(sg){ return (sg.reps || 1) * sg.dist; }
function segMin(sg){ return (sg.reps || 1) * sg.min; }
function segLabel(sg){ return `${sg.type}${sg.reps > 1 ? ` · ${sg.reps} × ${sg.dist < 1 ? Math.round(sg.dist * 1000) + ' m' : fmtKm(sg.dist) + ' km'}` : ` · ${fmtKm(sg.dist)} km`}`; }
function segDetail(sg){ return `${sg.min ? (sg.reps > 1 ? fmtMin(sg.min) + ' c/u · ' : fmtMin(sg.min) + ' · ') + paceStr(sg.min, sg.dist) : 'sin tiempo'}${sg.rest ? ` · rest ${sg.rest}` : ''}`; }
function runTotals(r){ const segs = r.segs || []; return segs.length ? {km: segs.reduce((a, x) => a + segKm(x), 0), min: segs.reduce((a, x) => a + segMin(x), 0)} : {km: r.km, min: r.min}; }
function renderRun(){
  const td = today(), ws = weekStart(td);
  const thisW = RUNS.filter(r => weekStart(r.date) === ws), weekKm = thisW.reduce((a, r) => a + runTotals(r).km, 0);
  const weeks = [0, 1, 2, 3].map(i => { const k = addDays(ws, -7 * i); const rs = RUNS.filter(r => weekStart(r.date) === k); return {k, km: rs.reduce((a, r) => a + runTotals(r).km, 0)}; }).reverse();
  const max = Math.max(10, ...weeks.map(x => x.km));
  const tot = {km: SEGS.reduce((a, x) => a + segKm(x), 0), min: SEGS.reduce((a, x) => a + segMin(x), 0)};
  const form = RUN_OPEN ? `<div class="rf">
      ${SEGS.length ? `<div class="segs">${SEGS.map((sg, i) => `<div class="seg-i"><div><b>${esc(segLabel(sg))}</b><span>${esc(segDetail(sg))}</span></div><button class="lnk" data-act="delseg" data-i="${i}">✕</button></div>`).join('')}
        <p class="seg-t">Total: <b>${fmtKm(tot.km)} km</b>${tot.min ? ` · ${fmtMin(tot.min)} · ${paceStr(tot.min, tot.km)}` : ''}</p></div>` : `<p class="alt">Armá la salida por tramos: calentamiento, pasadas, regenerativo… Cada tramo con su distancia y tiempo.</p>`}
      <div class="seg-new">
        <div class="rtypes">${SEG_TYPES.map((t, i) => `<button data-act="rtype" data-v="${t}" aria-pressed="${i === (SEGS.length ? 1 : 0)}">${t}</button>`).join('')}</div>
        <div class="rgrid4">
          <label>Repeticiones<input type="text" inputmode="numeric" id="sreps" placeholder="1"></label>
          <label>Distancia<input type="text" inputmode="decimal" id="sdist" placeholder="400 · 2"></label>
          <label>Tiempo<input type="text" inputmode="decimal" id="smin" placeholder="1.30"></label>
          <label>Descanso<input type="text" id="srest" placeholder="2'"></label>
        </div>
        <p class="alt seg-h">Tiempo: <b>1.30</b> = 1 min 30 s · <b>10.00</b> = 10 min · <b>1.05.20</b> = 1 h 5 min. En pasadas, el tiempo de cada una. Distancia en metros (400) o km (2 / 1,5).</p>
        <button class="addseg" data-act="addseg">+ Agregar tramo</button>
      </div>
      <div class="rgrid2"><label>Fecha<input type="date" id="rdate" value="${td}"></label><label>Notas<input type="text" id="rnotes" placeholder="opcional"></label></div>
      <button class="go" data-act="addrun">Guardar salida</button>
      ${RUN_MSG ? `<p class="msg err">${esc(RUN_MSG)}</p>` : ''}
    </div>` : '';
  const hist = RUNS.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 40).map(r => { const t = runTotals(r); return `<div class="ri">
      <div class="ri-d"><b>${fmtD(r.date).slice(0, 2)}</b><span>${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][parseD(r.date).getMonth()]}</span></div>
      <div class="ri-m"><b>${fmtKm(t.km)} km${t.min ? ` · ${fmtMin(t.min)} · ${paceStr(t.min, t.km)}` : ''}</b>
        ${(r.segs && r.segs.length) ? r.segs.map(sg => `<span>${esc(segLabel(sg))} — ${esc(segDetail(sg))}</span>`).join('') : `<span>${esc(r.type || '')}</span>`}${r.notes ? `<span class="ri-n">${esc(r.notes)}</span>` : ''}</div>
      <button class="lnk" data-act="delrun" data-id="${r.id}">✕</button></div>`; }).join('');
  $('main').innerHTML = `
  <section class="sec rw"><h2>Esta semana<span class="n">${thisW.length} SALIDA${thisW.length === 1 ? '' : 'S'}</span></h2><div class="tip">
    <div class="kbig"><b>${fmtKm(weekKm)}</b><span>km</span></div>
    <div class="wk">${weeks.map(x => `<div><div class="wkb"><i style="height:${Math.round(x.km / max * 100)}%"></i></div><b>${x.km ? x.km.toFixed(0) : '–'}</b><span>${x.k === ws ? 'esta' : fmtD(x.k)}</span></div>`).join('')}</div>
  </div></section>
  <div class="ad${RUN_OPEN ? ' open' : ''}"><div class="ad-top"><span class="ad-l">Anotar salida</span><span>${RUN_OPEN && SEGS.length ? `${SEGS.length} tramo${SEGS.length > 1 ? 's' : ''}` : ''}</span><button class="ad-btn" data-act="runtoggle" aria-label="${RUN_OPEN ? 'Cerrar' : 'Anotar salida'}">${RUN_OPEN ? '×' : '+'}</button></div>${form}</div>
  <section class="sec"><h2>Historial</h2>${RUNS.length ? `<div class="rl">${hist}</div>` : `<div class="tip"><p class="alt">Todavía no anotaste salidas. Tocá + para la primera.</p></div>`}</section>`;
}
// ---------- importar Excel ----------
const HEADS = {"CORE":"CORE","ZONA MEDIA":"ZONA MEDIA","FUERZA":"FUERZA","FUERZA DE EMPUJE":"FUERZA DE EMPUJE","TRANSFERENCIA":"TRANSFERENCIA","PLIOMETRIA":"PLIOMETRIA","PLYO + TRANSFERENCIA":"PLIO + TRANSFERENCIA","PLIO + TRANSFERENCIA":"PLIO + TRANSFERENCIA","ACCESORIOS":"ACCESORIOS","ACCESORIOS + PLIOMETRIA":"ACCESORIOS + PLIOMETRIA","PECHO":"PECHO","TREN SUPERIOR":"TREN SUPERIOR","ACOND. FISICO":"ACOND. FISICO","ACONDI FISICO":"ACOND. FISICO","ACONDICIONAMIENTO FISICO":"ACOND. FISICO","BICEPS":"BICEPS","TRICEPS":"TRICEPS","ESPALDA":"ESPALDA","HYROX":"HYROX","TRABAJO ESPECIFICO HYROX":"HYROX","FUERZA ESPECIFICA HYROX":"FUERZA HYROX","OLY":"OLY","RUN":"RUN","RUNING":"RUN","RUNNING":"RUN"};
function headOf(n){
  if (HEADS[n]) return HEADS[n];
  if (/\d/.test(n) || n.split(' ').length > 4) return null;
  return /^(ACCESORIOS|FUERZA|ACOND|TREN |ZONA |TRABAJO ESPEC|PLIO|PLYO)/.test(n) ? n : null;
}
function cleanUrl(u){ u = String(u).replace(/&amp;/g, "&"); try { const x = new URL(u); [...x.searchParams.keys()].filter(k => k.startsWith('utm_')).forEach(k => x.searchParams.delete(k)); return x.toString(); } catch(e){ return u; } }
function parseWorkbook(wb){
  const out = [];
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn]; if (!ws || !ws['!ref']) return;
    const rg = XLSX.utils.decode_range(ws['!ref']), cell = (r, c) => ws[XLSX.utils.encode_cell({r, c})];
    const days = [];
    for (let c = rg.s.c; c <= rg.e.c; c++) {
      const h = cell(rg.s.r, c), hv = h && h.v != null ? String(h.v).trim() : '';
      if (!/^D[IÍ]A/i.test(hv)) continue;
      const secs = []; let blk = [];
      const close = () => { if (blk.length && secs.length) secs[secs.length - 1].blocks.push(blk); blk = []; };
      for (let r = rg.s.r + 1; r <= rg.e.r; r++) {
        const x = cell(r, c), s = x && x.v != null ? String(x.v).replace(/\s+/g, ' ').trim() : '';
        if (!s || /^-{2,}$/.test(s)) { close(); continue; }
        const hd = headOf(norm(s)); if (hd) { close(); secs.push({title: hd, blocks: []}); continue; }
        if (/^mira video/i.test(s)) continue;
        if (!secs.length) secs.push({title: 'BLOQUE', blocks: []});
        if (/^https?:\/\//i.test(s)) blk.push({v: cleanUrl((x.l && x.l.Target) || s)}); else blk.push({t: s});
      }
      close();
      if (secs.length) days.push({name: 'DÍA ' + (days.length + 1), sections: secs});
    }
    if (days.length) out.push({name: sn.replace(/\s+/g, ' ').trim(), days});
  });
  return out;
}
let IMPORT_MSG = ['', false];
async function importExcel(file){
  IMPORT_MSG = ['Leyendo el Excel…', false]; renderImport();
  try {
    if (!window.XLSX) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const weeks = parseWorkbook(wb);
    if (!weeks.length) throw new Error('No encontré semanas en ese Excel. ¿Tiene la fila de arriba con DÍA 1, DÍA 2…?');
    const newest = weeks[weeks.length - 1], cur = DATA[0].name;
    if (newest.name === cur) { IMPORT_MSG = ['Ese Excel no tiene una semana nueva: la última es ' + esc(cur) + ', que ya estás usando.', false]; }
    else { EXTRA = [newest]; store('fm-extra-weeks', EXTRA); DATA = allWeeks(); W = 0; D = 0; ACTIVE = null; store('fm-active', null); IMPORT_MSG = ['Listo: ahora estás en ' + esc(newest.name) + '. ' + esc(cur) + ' se borró.', false]; }
  } catch (e) { IMPORT_MSG = [(e && e.message && !/Script error/.test(e.message)) ? esc(e.message) : 'No pude leer el Excel. Revisá tu conexión y probá de nuevo.', true]; }
  renderImport(); renderTop();
}

// =====================================================================
// NAVEGACIÓN Y EVENTOS
// =====================================================================
const TITLES = {home: 'Entrenamiento', run: 'Running', profile: 'Perfil'};
function renderTop(){
  const full = VIEW === 'workout';
  document.body.classList.toggle('inwork', full);
  $('ttl').textContent = VIEW === 'summary' ? 'Resumen' : VIEW === 'hist' ? 'Sesión' : VIEW === 'exo' ? 'Progreso' : VIEW === 'preview' ? 'Rutina' : TITLES[TAB];
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === TAB)));
}
function renderMain(){
  if (VIEW === 'workout' && ACTIVE) return renderWorkout();
  if (VIEW === 'summary' && SUMMARY) { $('main').innerHTML = sessionHTML(SUMMARY, true); return; }
  if (VIEW === 'hist') { const s = SESSIONS.find(x => String(x.id) === String(HIST_ID)); if (s) { $('main').innerHTML = sessionHTML(s, false); return; } VIEW = null; }
  if (VIEW === 'preview') return renderPreview();
  if (VIEW === 'exo' && EXO_KEY && LOGS[EXO_KEY]) return renderExo();
  ({home: renderHome, run: renderRun, profile: renderProfile}[TAB] || renderHome)();
}
function renderAll(scroll){ renderTop(); renderMain(); if (scroll !== false) window.scrollTo({top: 0}); }
setInterval(() => { const t = $('wtimer'); if (t && ACTIVE) t.textContent = elapsed(); }, 1000);
let DISCARD_ARMED = 0;

document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-act]'); if (!b) return;
  const ds = b.dataset;
  if (ds.tab) { TAB = ds.tab; VIEW = null; saveUI(); return renderAll(); }
  if (ds.day !== undefined) { D = +ds.day; return renderAll(false); }
  const act = ds.act; if (!act) return;
  if (act === 'start') { ACTIVE = {w: DATA[0].name, d: D, start: Date.now(), vals: {}}; store('fm-active', ACTIVE); VIEW = 'workout'; renderAll(); store('fm-active', ACTIVE); return; }
  if (act === 'preview') { VIEW = 'preview'; return renderAll(); }
  if (act === 'resume') { D = ACTIVE.d; VIEW = 'workout'; return renderAll(); }
  if (act === 'tick') {
    const row = b.closest('.st-r'), k = row.dataset.k, i = +row.dataset.i, v = ACTIVE.vals[k][i], inp = row.querySelector('[data-f="kg"]'), rp = row.querySelector('[data-f="reps"]');
    if (!v.ok && !row.classList.contains('nt')) {
      if (!inp.value.trim()) { const prevRow = row.previousElementSibling, pin = prevRow && prevRow.querySelector && prevRow.querySelector('[data-f="kg"]'); inp.value = /\d/.test(inp.placeholder) ? inp.placeholder : (pin && pin.value) || ''; }
      if (rp && !rp.value.trim() && rp.dataset.t) rp.value = rp.placeholder;
      if (rp && !rp.dataset.t && !rp.value.trim()) { rp.focus(); return; }
    }
    v.kg = inp.value.trim(); if (rp) v.reps = rp.value.trim(); v.ok = !v.ok; row.classList.toggle('ok', v.ok); store('fm-active', ACTIVE);
    const p = progress(), el = $('wprog'); if (el) el.textContent = `${p.done}/${p.tot}`; return;
  }
  if (act === 'finish') { finishWorkout(); return renderAll(); }
  if (act === 'discard') {
    if (Date.now() - DISCARD_ARMED > 4000) { DISCARD_ARMED = Date.now(); b.textContent = '¿Seguro? Tocá de nuevo para descartar'; return; }
    ACTIVE = null; store('fm-active', null); VIEW = null; DISCARD_ARMED = 0; return renderAll();
  }
  if (act === 'back') { VIEW = null; SUMMARY = null; return renderAll(); }
  if (act === 'exo') { EXO_KEY = ds.k; VIEW = 'exo'; return renderAll(); }
  if (act === 'export') return exportBackup();
  if (act === 'hist') { HIST_ID = ds.id; VIEW = 'hist'; return renderAll(); }
  if (act === 'delses') {
    if (Date.now() - DISCARD_ARMED > 4000) { DISCARD_ARMED = Date.now(); b.textContent = '¿Seguro? Tocá de nuevo para borrar'; return; }
    SESSIONS = SESSIONS.filter(s => String(s.id) !== ds.id); store('fm-sessions', SESSIONS); VIEW = null; DISCARD_ARMED = 0; return renderAll();
  }
  if (act === 'runtoggle') { RUN_OPEN = !RUN_OPEN; RUN_MSG = ''; if (!RUN_OPEN) SEGS = []; renderMain(); if (RUN_OPEN) { const i = $('sdist'); i && i.focus(); } return; }
  if (act === 'rtype') { document.querySelectorAll('.rtypes button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); const r = $('sreps'); if (r && ds.v === 'Pasadas' && !r.value) r.placeholder = '4'; return; }
  if (act === 'addseg') {
    const type = (document.querySelector('.rtypes [aria-pressed="true"]') || {}).dataset?.v || 'Continuo';
    const dist = distKm($('sdist').value), reps = Math.max(1, parseInt($('sreps').value) || 1), min = parseMin($('smin').value), rest = $('srest').value.trim();
    if (!dist) { RUN_MSG = 'Poné la distancia del tramo.'; renderMain(); $('sdist').focus(); return; }

  }
  if (act === 'delseg') { SEGS.splice(+ds.i, 1); return renderMain(); }
  if (act === 'addrun') {
    if (!SEGS.length) { RUN_MSG = 'Agregá al menos un tramo.'; renderMain(); return; }
    const t = {km: SEGS.reduce((a, x) => a + segKm(x), 0), min: SEGS.reduce((a, x) => a + segMin(x), 0)};
    RUNS.push({id: Date.now(), date: $('rdate').value || today(), type: SEGS.length > 1 ? 'Combinada' : SEGS[0].type, km: t.km, min: t.min, segs: SEGS, notes: $('rnotes').value.trim()}); store('fm-run', RUNS);
    RUN_OPEN = false; RUN_MSG = ''; SEGS = []; return renderAll(false);
  }
  if (act === 'delrun') { RUNS = RUNS.filter(r => String(r.id) !== ds.id); store('fm-run', RUNS); return renderAll(false); }
  if (act === 'update') {
    store('fm-upd-try', {v: ds.v, t: Date.now()});
    try { await fetch(location.pathname, {cache: 'reload'}); } catch(e){}
    location.replace(location.pathname + '?v=' + encodeURIComponent(ds.v));
  }
});
document.addEventListener('input', e => {
  if (!e.target.classList.contains('st-in') || !ACTIVE) return;
  const row = e.target.closest('.st-r'); ACTIVE.vals[row.dataset.k][+row.dataset.i][e.target.dataset.f === 'reps' ? 'reps' : 'kg'] = e.target.value.trim(); store('fm-active', ACTIVE);

// ---------- aviso de versión nueva ----------
async function checkUpdate(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
    const v = (await r.json()).v;
    const tried = load('fm-upd-try', null);
    if (tried && tried.v === v && Date.now() - tried.t < 20 * 60 * 1000) return;   // ya actualizó a esta versión hace poco
    if (v && v !== APP_VERSION) { $('upd').innerHTML = `Hay una versión nueva de la app <button data-act="update" data-v="${esc(v)}">Actualizar</button>`; $('upd').hidden = false; }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

D = nextDay();
renderAll();
if (APP_VERSION === (load('fm-upd-try', {}) || {}).v) store('fm-upd-try', null);
checkUpdate();
