<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Plan Felipe Majul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#151517; --surface-2:#1c1c1f; --ink:#f4f2ec; --muted:#8d8d93; --line:#2a2a2e;
  --accent:#ff3b1f; --accent-ink:#ffffff; --chip:#222226; --stripe:repeating-linear-gradient(135deg,#ff3b1f 0 10px,#0b0b0c 10px 20px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0 0 env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;
  background-image:radial-gradient(circle at 50% -20%,#232326 0,transparent 55%)}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.top::before{content:"";display:block;height:6px;margin:-12px -16px 12px;background:var(--stripe)}
.top::after{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg)}
h1{font-family:Anton,"Barlow Condensed",Impact,sans-serif;font-weight:400;font-size:34px;line-height:.95;margin:0 0 12px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 span{color:var(--accent);font-size:15px;letter-spacing:.14em;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 14px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.days button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:400 22px Anton,"Barlow Condensed",sans-serif;text-transform:uppercase;padding:9px 0;border-radius:4px;cursor:pointer;letter-spacing:.04em;position:relative}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:skewX(-6deg)}
.days button[aria-pressed="true"]>*{transform:skewX(6deg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:16px 16px 48px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);overflow:hidden}
.sec h2{margin:0;padding:10px 14px;font-family:Anton,"Barlow Condensed",sans-serif;font-weight:400;font-size:22px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.sec h2 .n{font-size:11px;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--accent);letter-spacing:.14em;border:1px solid var(--accent);padding:2px 6px;margin-left:auto}
.block{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.block+.block{border-top:1px dashed var(--line)}
.block p{margin:0}
.block p.first{font-weight:600;text-transform:uppercase;font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.03em}
.sets{color:var(--accent);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
a.v,button.v{display:flex;align-items:center;gap:10px;margin-top:6px;padding:11px 12px;background:var(--ink);color:var(--bg);text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
a.v:active{background:var(--accent);color:#fff}
a.v svg{flex:0 0 auto}
a.v small{color:var(--accent);font-weight:700;margin-left:auto;font-size:12px;letter-spacing:.14em}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:8px;text-transform:uppercase;letter-spacing:.14em;font-family:"Barlow Condensed",sans-serif;font-weight:600}
@media (prefers-reduced-motion:no-preference){ main{animation:fade .18s ease} }
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.mode{display:grid;grid-template-columns:1fr 1fr;margin:0 0 12px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mode button{background:var(--chip);color:var(--muted);border:0;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 0;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:#fff}
.days.two{grid-template-columns:1fr 1fr}
.days.two button{font-size:18px;padding:8px 0}
.days.hide{display:none}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum span{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sum span b{color:var(--ink)}
.sec h2 .t{color:var(--accent)}
.meal .main{margin:0;font-size:16px;line-height:1.5}
.meal .main b,.alt b{color:var(--accent);font-weight:700}
.alt{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.alt.o::before{content:"O: ";font-weight:700;color:var(--ink);font-family:"Barlow Condensed",sans-serif;letter-spacing:.06em}
.sec.g{border-left-color:var(--muted)}
.sec.g h2{border-bottom:0;font-size:18px;color:var(--muted)}
table.eq{width:100%;border-collapse:collapse;font-size:14px}
table.eq th,table.eq td{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.eq th{color:var(--muted);font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;border-top:0}
table.eq td:first-child{font-weight:600}
h1 b{font-weight:400}
table.eq.c5{table-layout:fixed}
table.eq.c5 th,table.eq.c5 td{padding:8px 5px;font-size:13px}
table.eq.c5 th{font-size:11px;letter-spacing:.04em}
table.eq.c5 th:first-child,table.eq.c5 td:first-child{padding-left:12px;width:26%}
.tip{padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.tip p{margin:0}

button.v{width:100%;border:0;cursor:pointer;text-align:left}
.cf label.h{display:block;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.cf .mseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cf .mseg button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 13px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;padding:10px 0;border-radius:4px;cursor:pointer}
.cf .mseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cf .tg{margin-top:8px;color:var(--muted);font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.cf .tg b{color:var(--ink)}
.cf textarea,.cf input[type=password]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px;font:16px Barlow,sans-serif}
.cf textarea{min-height:110px;resize:vertical}
.cf .ph{display:flex;gap:12px;align-items:center}
.cf .ph label.btn{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--muted);padding:11px 14px;border-radius:4px;cursor:pointer;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.cf .ph input{display:none}
.cf .th{position:relative;display:none}
.cf .th img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
.cf .th button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.cf .go{width:100%;border:0;background:var(--accent);color:#fff;font:400 24px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:14px 0;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.cf .go:disabled{opacity:.5;cursor:wait}
.cf .msg{color:var(--muted);font-size:14px;min-height:1em}
.cf .msg.err{color:#ff8a78}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font:14px Barlow,sans-serif;cursor:pointer;padding:0}
.big{font:400 54px/1 Anton,Impact,sans-serif;color:var(--accent)}
.big small{font:700 16px "Barlow Condensed",sans-serif;color:var(--ink);letter-spacing:.08em;margin-left:6px;text-transform:uppercase}
.porc{font-size:17px;font-weight:600}
.bar .bt{display:flex;justify-content:space-between;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.bar .bt span:last-child{color:var(--muted)}
.track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.ok{background:#4fbf6a}
.tip ul{margin:0;padding-left:20px}
.go{display:block;width:100%;border:0;background:var(--accent);color:#fff;font:400 22px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:13px 0;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.go:disabled{opacity:.5;cursor:wait}
main>.go{margin-top:4px}
.done-ok{margin:0;color:#4fbf6a;font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.days button.done span::after{content:" ✓";color:#4fbf6a}
.days button.hoy{box-shadow:inset 0 -3px 0 var(--accent)}
.days button.hoy[aria-pressed="true"]{box-shadow:none}
.log{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.log p{margin:0}
.lg-last{font-size:14px;color:var(--ink)}
.lg-last span{color:var(--muted)}
.lg-today{font-size:14px;color:#4fbf6a}
.lg-today b{color:var(--ink)}
.lg-row{display:flex;gap:6px}
.lg-row input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:15px Barlow,sans-serif}
.lg-row button{border:0;background:var(--ink);color:var(--bg);font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;border-radius:4px;cursor:pointer}
.cf label{display:flex;flex-direction:column;gap:6px;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cf input[type=date],.cf input[type=number],.cf input[type=text],.cf select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font:16px Barlow,sans-serif;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.btn.up{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border:1px dashed var(--muted);padding:11px 14px;border-radius:4px;cursor:pointer;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.msg{margin:0;color:var(--muted);font-size:14px}
.msg.err{color:#ff8a78}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wkb{height:90px;width:100%;display:flex;align-items:flex-end;background:var(--chip);border-radius:4px;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--accent);min-height:2px}
.wk b{font:400 20px Anton,sans-serif}
.wk span{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chk button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--muted);font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 4px;border-radius:4px;cursor:pointer}
.chk button[data-v="plan"][aria-pressed="true"]{background:#1f3a26;border-color:#4fbf6a;color:#bff0c9}
.chk button[data-v="otra"][aria-pressed="true"]{background:#3a2f1a;border-color:#e0a441;color:#ffe1a8}
.chk button[data-v="skip"][aria-pressed="true"]{background:#3a1d1a;border-color:var(--accent);color:#ffc2b8}
.calcd{color:#4fbf6a;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.adj{background:#2a1a12;border:1px solid var(--accent);padding:10px 12px;font-size:14px;line-height:1.45}
.adj span{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:#8d8d93;font:11px Barlow,sans-serif}
.block.row{flex-direction:row;justify-content:space-between;align-items:center}
.shop{flex-direction:row !important;align-items:flex-start;gap:12px;cursor:pointer}
.shop input{margin-top:4px;width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.shop small{color:var(--muted);font-size:13px}
.shop.got b{text-decoration:line-through;color:var(--muted)}
#tfab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;min-width:58px;height:58px;padding:0 14px;border-radius:29px;border:0;background:var(--ink);color:var(--bg);font:400 24px Anton,sans-serif;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.6);cursor:pointer}
#tfab.on{background:var(--accent);color:#fff}
#tover{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
#tover[hidden]{display:none}
#tsheet{width:100%;max-width:560px;background:var(--surface);border-top:5px solid var(--accent);padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#tsheet .tt{display:flex;justify-content:space-between;align-items:center;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#tbig{font:400 92px/1 Anton,Impact,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
#tsheet.flash #tbig{color:var(--accent);animation:fl .5s ease-in-out 6 alternate}
@keyframes fl{to{opacity:.25}}
.tp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tp button,.ta button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;padding:10px 0;border-radius:4px;cursor:pointer}
.ta{display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px}
.ta .go{clip-path:none;border-radius:4px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--accent);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:536px;margin:0 auto}
#upd[hidden]{display:none}
#upd button{border:0;background:#fff;color:var(--accent);font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
main{padding-bottom:110px}
</style>
</head>
<body>
<div class="top">

</div>

</div></div>

const HEADS = {"CORE":"CORE","ZONA MEDIA":"ZONA MEDIA","FUERZA":"FUERZA","FUERZA DE EMPUJE":"FUERZA DE EMPUJE","TRANSFERENCIA":"TRANSFERENCIA","PLIOMETRIA":"PLIOMETRIA","PLYO + TRANSFERENCIA":"PLIO + TRANSFERENCIA","PLIO + TRANSFERENCIA":"PLIO + TRANSFERENCIA","ACCESORIOS":"ACCESORIOS","ACCESORIOS + PLIOMETRIA":"ACCESORIOS + PLIOMETRIA","PECHO":"PECHO","TREN SUPERIOR":"TREN SUPERIOR","ACOND. FISICO":"ACOND. FISICO","ACONDI FISICO":"ACOND. FISICO","ACONDICIONAMIENTO FISICO":"ACOND. FISICO","BICEPS":"BICEPS","TRICEPS":"TRICEPS","ESPALDA":"ESPALDA","HYROX":"HYROX","TRABAJO ESPECIFICO HYROX":"HYROX","FUERZA ESPECIFICA HYROX":"FUERZA HYROX","OLY":"OLY","RUN":"RUN","RUNING":"RUN","RUNNING":"RUN"};
function headOf(n){
  if (HEADS[n]) return HEADS[n];
  if (/\d/.test(n) || n.split(' ').length > 4) return null;
  return /^(ACCESORIOS|FUERZA|ACOND|TREN |ZONA |TRABAJO ESPEC|PLIO|PLYO)/.test(n) ? n : null;
}
function cleanUrl(u){ u = String(u).replace(/&amp;/g, "&"); try { const x = new URL(u); [...x.searchParams.keys()].filter(k => k.startsWith('utm_')).forEach(k => x.searchParams.delete(k)); return x.toString(); } catch(e){ return u; } }
function parseWorkbook(wb){
  const out = [];
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn]; if (!ws || !ws['!ref']) return;
    const rg = XLSX.utils.decode_range(ws['!ref']), cell = (r, c) => ws[XLSX.utils.encode_cell({r, c})];
    const days = [];
    for (let c = rg.s.c; c <= rg.e.c; c++) {
      const h = cell(rg.s.r, c), hv = h && h.v != null ? String(h.v).trim() : '';
      if (!/^D[IÍ]A/i.test(hv)) continue;
      const secs = []; let blk = [];
      const close = () => { if (blk.length && secs.length) secs[secs.length - 1].blocks.push(blk); blk = []; };
      for (let r = rg.s.r + 1; r <= rg.e.r; r++) {
        const x = cell(r, c), s = x && x.v != null ? String(x.v).replace(/\s+/g, ' ').trim() : '';
        if (!s || /^-{2,}$/.test(s)) { close(); continue; }
        const hd = headOf(norm(s)); if (hd) { close(); secs.push({title: hd, blocks: []}); continue; }
        if (/^mira video/i.test(s)) continue;
        if (!secs.length) secs.push({title: 'BLOQUE', blocks: []});
        if (/^https?:\/\//i.test(s)) blk.push({v: cleanUrl((x.l && x.l.Target) || s)}); else blk.push({t: s});
      }
      close();
      if (secs.length) days.push({name: 'DÍA ' + (days.length + 1), sections: secs});
    }
    if (days.length) out.push({name: sn.replace(/\s+/g, ' ').trim(), days});
  });
  return out;
}

async function importExcel(file){
  IMPORT_MSG = ['Leyendo el Excel…', false]; renderImport();
  try {
    if (!window.XLSX) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const weeks = parseWorkbook(wb), have = new Set(DATA.map(w => w.name));
    const fresh = weeks.filter(w => !have.has(w.name));
    if (!weeks.length) throw new Error('No encontré semanas en ese Excel. ¿Tiene la fila de arriba con DÍA 1, DÍA 2…?');
    if (!fresh.length) { IMPORT_MSG = ['Ese Excel no tiene semanas nuevas: ya están todas cargadas.', false]; }
    else { EXTRA = EXTRA.concat(fresh); store('fm-extra-weeks', EXTRA); DATA = allWeeks(); IMPORT_MSG = ['Listo. Agregué: ' + fresh.map(w => esc(w.name)).join(', '), false]; }
  } catch (e) { IMPORT_MSG = [(e && e.message && !/Script error/.test(e.message)) ? esc(e.message) : 'No pude leer el Excel. Revisá tu conexión y probá de nuevo.', true]; }

}

const MKEYS = ['desayuno', 'almuerzo', 'merienda', 'cena'];
let MLOG = load('fm-meals', {});     // {fecha: {desayuno: 'plan'|'otra'|'skip'}}
let CLOG = load('fm-calclog', {});   // {fecha: [{meal, plato, gramos, kcal, p}]}
function dayProtein(date){
  const T = targets(), st = MLOG[date] || {}, calc = CLOG[date] || [];
  let p = 0, unknown = false;
  MKEYS.forEach(k => {
    const c = calc.filter(x => x.meal === k);
    if (c.length) p += c.reduce((a, x) => a + x.p, 0);
    else if (st[k] === 'plan') p += T[k].p;
    else if (st[k] === 'otra') unknown = true;
  });
  return {p: Math.round(p), unknown};
}
function adherence(){
  const td = today(), ws = weekStart(td);
  let ok = 0, tot = 0;
  for (let d = ws; d <= td; d = addDays(d, 1)) {
    const st = MLOG[d] || {}, calc = CLOG[d] || [];
    if (d !== td && !calc.length && !MKEYS.some(k => st[k])) continue;
    MKEYS.forEach(k => {
      const marked = st[k] || (calc.some(x => x.meal === k) ? 'calc' : null);
      if (d === td && !marked) return;
      tot++; if (marked === 'plan' || marked === 'calc') ok++;
    });
  }
  return tot ? Math.round(ok / tot * 100) : null;
}

// ---------- progreso: peso, cintura y ajuste automático ----------
let WEIGHTS = load('fm-weights', []);   // [{date, kg, waist}]
function weeklyAvgs(){
  const g = {};
  WEIGHTS.forEach(x => { const k = weekStart(x.date); (g[k] = g[k] || []).push(x.kg); });
  return Object.keys(g).sort().map(k => ({k, n: g[k].length, avg: g[k].reduce((a, b) => a + b, 0) / g[k].length}));
}
function evaluateAdj(){
  const cur = weekStart(today());
  const wk = weeklyAvgs().filter(x => x.k < cur && x.n >= 2);
  if (wk.length < 2) return null;
  const since = ADJ.hist.length ? ADJ.hist[ADJ.hist.length - 1].date : '0000-00-00';
  const deltas = [];
  for (let i = 1; i < wk.length; i++) {
    const gap = Math.round((parseD(wk[i].k) - parseD(wk[i - 1].k)) / 6048e5) || 1;
    deltas.push({k: wk[i].k, rate: (wk[i].avg - wk[i - 1].avg) / gap});
  }
  const after = deltas.filter(d => d.k >= since);
  const last = after[after.length - 1];
  if (last && last.rate < -1 && ADJ.alm < 2) {
    ADJ.alm++; ADJ.hist.push({date: today(), type: 'alm', msg: `Bajaste ${Math.abs(last.rate).toFixed(1).replace('.', ',')} kg en una semana: más carbohidratos en el almuerzo`}); store('fm-adj', ADJ); return ADJ.hist[ADJ.hist.length - 1].msg;
  }
  if (after.length >= 2 && after.slice(-2).every(d => d.rate > -0.5) && ADJ.cena < 2) {
    ADJ.cena++; ADJ.hist.push({date: today(), type: 'cena', msg: '2 semanas bajando menos de 0,5 kg: menos carbohidratos en la cena'}); store('fm-adj', ADJ); return ADJ.hist[ADJ.hist.length - 1].msg;
  }
  return null;
}
function chartSVG(){
  if (WEIGHTS.length < 2) return `<p class="alt">El gráfico aparece cuando tengas al menos 2 pesajes.</p>`;
  const pts = WEIGHTS.slice().sort((a, b) => a.date.localeCompare(b.date));
  const avgs = weeklyAvgs();
  const mid = a => parseD(a.k).getTime() + 3 * 864e5;
  const times = pts.map(p => parseD(p.date).getTime()).concat(avgs.map(mid));
  const t0 = Math.min(...times), t1 = Math.max(Math.max(...times), t0 + 864e5 * 6);
  const vals = pts.map(p => p.kg).concat(avgs.map(a => a.avg));
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const Wd = 340, H = 180, L = 34, R = 8, T = 10, B = 24;
  const X = t => L + (t - t0) / (t1 - t0) * (Wd - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = Math.max(1, Math.round((hi - lo) / 4));
  let grid = ''; for (let v = lo; v <= hi; v += step) grid += `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2a2e"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const line = avgs.map(a => `${X(mid(a)).toFixed(1)},${Y(a.avg).toFixed(1)}`).join(' ');
  const xl = [pts[0].date, pts[pts.length - 1].date].map((d, i) => `<text x="${i ? Wd - R : L}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}">${fmtD(d)}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${H}" class="chart" role="img" aria-label="Peso a lo largo del tiempo">${grid}${xl}
    ${pts.map(p => `<circle cx="${X(parseD(p.date).getTime()).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3" fill="#8d8d93"/>`).join('')}
    ${avgs.length > 1 ? `<polyline points="${line}" fill="none" stroke="#ff3b1f" stroke-width="3" stroke-linejoin="round"/>` : ''}
    ${avgs.map(a => `<circle cx="${X(mid(a)).toFixed(1)}" cy="${Y(a.avg).toFixed(1)}" r="4.5" fill="#ff3b1f"/>`).join('')}
  </svg><p class="alt"><b style="color:var(--accent)">●</b> promedio semanal · <b style="color:var(--muted)">●</b> cada pesaje</p>`;
}

async function shrinkImg(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1024 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

4. Traducí la porción a algo fácil de ver (ej: "1 zapallito y medio", "1 plato hondo al ras").

Respondé SOLO con JSON válido, sin texto extra:
{"plato":"nombre corto","ingredientes":["..."],"por100":{"kcal":0,"p":0,"c":0,"g":0},"gramos":0,"porcion_texto":"...","agregar":["..."],"consejo":"una frase","confianza":"alta|media|baja"}`;
}
async function runCalc(){
  if (CBUSY) return;
  const ta = $('cdesc'); if (ta) CDESC = ta.value.trim();
  if (!CDESC && !CIMG) { CMSG = ["Escribí qué vas a comer o sacale una foto.", true]; renderCalc(); return; }
  CBUSY = true; CMSG = ["", false]; renderCalc();
  const t = targets()[CM], content = [{type: "text", text: calcPrompt(CDESC, t, !!CIMG)}];
  if (CIMG) content.push({type: "image_url", image_url: {url: CIMG}});
  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {"Authorization": "Bearer " + orKey(), "Content-Type": "application/json", "X-Title": "Plan Felipe"},
      body: JSON.stringify({model: OR_MODEL, max_tokens: 2000, reasoning: {enabled: false}, messages: [{role: "system", content: "Respondé únicamente con un objeto JSON válido. Nada de texto antes o después."}, {role: "user", content}]})
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) throw new Error("La clave no funciona. Tocá \"cambiar clave\" y pegala de nuevo.");
    if (res.status === 402) throw new Error("No te queda saldo en OpenRouter. Cargá crédito y probá de nuevo.");
    if (res.status === 429) throw new Error("Muchas consultas seguidas. Esperá un minuto.");
    if (!res.ok) throw new Error((data.error && data.error.message) || "OpenRouter devolvió un error. Probá de nuevo.");
    if (data.error) throw new Error(data.error.message || "OpenRouter devolvió un error.");
    const ch = data.choices?.[0] || {};
    if (ch.error) throw new Error(ch.error.message || "El modelo devolvió un error.");
    let txt = ch.message?.content ?? "";
    if (Array.isArray(txt)) txt = txt.map(x => typeof x === "string" ? x : (x.text || "")).join("");
    txt = String(txt).replace(/```(json)?/gi, "").trim();
    const a = txt.indexOf('{'), z = txt.lastIndexOf('}');
    if (a < 0 || z <= a) throw new Error(txt ? "La IA respondió algo que no entiendo: \"" + txt.slice(0, 140) + "\"" : "La IA no devolvió texto (" + (ch.finish_reason || "sin motivo") + "). Probá de nuevo.");
    let r; try { r = JSON.parse(txt.slice(a, z + 1)); } catch (pe) { throw new Error("La respuesta vino incompleta: \"" + txt.slice(0, 140) + "\""); }
    r.gramos = Number(String(r.gramos ?? "").replace(/[^0-9.]/g, "")) || 0;
    if (!r.gramos) throw new Error("No pude calcular la porción. Describí mejor el plato.");
    CRES = {r, m: CM}; CADDED = false; CMSG = ["", false];
  } catch (e) {
    CMSG = [(e && e.message) ? (e.message === "Failed to fetch" ? "No hay conexión con OpenRouter. Revisá internet y probá de nuevo." : e.message) : "Algo falló. Probá de nuevo.", true];
  } finally {
    CBUSY = false; renderCalc();
    if (CRES && !CMSG[1]) { const h = document.querySelectorAll('#main .sec')[1]; h && h.scrollIntoView({behavior: 'smooth'}); }
  }
}

function renderShop(){

  + `<p class="foot">Las cantidades siguen tu ajuste actual · <button class="lnk" data-act="shopreset">desmarcar todo</button></p>`;
}

  const EQ = [

    ["Grasa", ["Esto", "Equivale a"], [["½ palta chica (70 g)", "1 cda de aceite de oliva o 20 g de frutos secos"]], ""],
    ["Desayuno y merienda", ["Esto", "Equivale a"], [["1 tostada integral", "2 galletas de arroz o 20 g de granola"], ["1 fruta", "1 banana chica o 2 mandarinas"], ["1 huevo", "2 claras o 30 g de jamón"]], ""]
  ];
  const RULES = [

    "<b>Pesos en cocido.</b> Pesá las primeras semanas hasta que te salga a ojo.",

    "<b>Libres siempre:</b> mate amargo, café, té, agua, edulcorante, limón, vinagre, mostaza y especias.",

  $('main').innerHTML = EQ.map(([title, head, rows, note]) => `<section class="sec"><h2>${title}</h2><table class="eq"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>${note ? `<div class="tip"><p class="alt">${note}</p></div>` : ''}</section>`).join('')
    + `<section class="sec"><h2>Reglas</h2><div class="tip">${RULES.map(r => `<p>${r}</p>`).join('')}</div></section>`

// =====================================================================
// NAVEGACIÓN Y EVENTOS
// =====================================================================
const NTABS = [['plan', 'Plan'], ['prog', 'Progreso'], ['calc', 'Calculadora'], ['shop', 'Compras'], ['eq', 'Cambios']];
function renderTop(){
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === MODE)));
  $('ttl').textContent = MODE === 'n' ? 'Plan de nutrición' : 'Plan de entrenamiento';
  const dd = $('days');
  if (MODE === 'n') {
    $('weeks').innerHTML = NTABS.map(([k, l]) => `<button role="tab" aria-pressed="${k === NT}" data-nt="${k}">${l}</button>`).join('');
    dd.className = 'days hide'; dd.innerHTML = '';
  } else {
    $('weeks').innerHTML = DATA.map((w, i) => `<button role="tab" aria-pressed="${TV === 'week' && i === W}" data-w="${i}">${esc(w.name)}</button>`).join('')
      + `<button role="tab" aria-pressed="${TV === 'run'}" data-tv="run">🏃 Running</button><button role="tab" aria-pressed="${TV === 'import'}" data-tv="import">+ Excel</button>`;
    if (TV === 'week') {
      const wn = DATA[W].name;
      dd.className = 'days';
      dd.innerHTML = DATA[W].days.map((d, i) => `<button role="tab" aria-pressed="${i === D}" data-d="${i}" class="${DONE.some(x => x.w === wn && x.d === i) ? 'done' : ''}${TODAY_POS.w === W && TODAY_POS.d === i ? ' hoy' : ''}"><span>${esc(d.name.replace(/D[IÍ]A/i, 'Día'))}</span></button>`).join('');
    } else { dd.className = 'days hide'; dd.innerHTML = ''; }
  }
  const sel = $('weeks').querySelector('[aria-pressed="true"]'); sel && sel.scrollIntoView({inline: 'center', block: 'nearest'});
}
function renderMain(){
  if (MODE === 'n') ({plan: renderPlan, prog: renderProg, calc: renderCalc, shop: renderShop, eq: renderEq}[NT] || renderPlan)();
  else ({week: renderWeek, run: renderRun, import: renderImport}[TV] || renderWeek)();
}
function renderAll(scroll){ renderTop(); renderMain(); if (scroll !== false) window.scrollTo({top: 0}); }

document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-act]'); if (!b) return;
  const ds = b.dataset;
  if (ds.m) { MODE = ds.m; saveUI(); return renderAll(); }
  if (ds.nt) { NT = ds.nt; saveUI(); return renderAll(); }
  if (ds.w !== undefined) { TV = 'week'; W = +ds.w; D = Math.min(D, DATA[W].days.length - 1); saveUI(); return renderAll(); }
  if (ds.d !== undefined) { D = +ds.d; return renderAll(); }
  if (ds.tv) { TV = ds.tv; saveUI(); return renderAll(); }
  const act = ds.act; if (!act) return;
  if (act === 'log') {
    const inp = document.querySelector(`input[data-exin="${CSS.escape(ds.ex)}"]`); const v = inp && inp.value.trim(); if (!v) return inp && inp.focus();
    (LOGS[ds.ex] = LOGS[ds.ex] || []).unshift({date: today(), t: v, w: DATA[W].name}); store('fm-logs', LOGS); return renderAll(false);
  }
  if (act === 'unlog') { LOGS[ds.ex] = (LOGS[ds.ex] || []).filter(h => h.date !== today()); store('fm-logs', LOGS); return renderAll(false); }
  if (act === 'done') { DONE.push({w: DATA[W].name, d: D, date: today()}); store('fm-done', DONE); return renderAll(); }
  if (act === 'undone') { const i = DONE.map(x => x.w + x.d).lastIndexOf(DATA[W].name + D); if (i >= 0) DONE.splice(i, 1); store('fm-done', DONE); return renderAll(false); }
  if (act === 'addrun') {
    const km = Number(String($('rkm').value).replace(',', '.')), min = parseMin($('rmin').value);
    if (!km) { $('rmsg').textContent = 'Poné los kilómetros.'; $('rmsg').className = 'msg err'; return; }
    RUNS.push({id: Date.now(), date: $('rdate').value || today(), type: $('rtype').value, km, min, notes: $('rnotes').value.trim()}); store('fm-run', RUNS); return renderAll(false);
  }
  if (act === 'delrun') { RUNS = RUNS.filter(r => String(r.id) !== ds.id); store('fm-run', RUNS); return renderAll(false); }
  if (act === 'delweek') { const w = EXTRA[+ds.i]; EXTRA.splice(+ds.i, 1); store('fm-extra-weeks', EXTRA); DATA = allWeeks(); W = Math.min(W, DATA.length - 1); IMPORT_MSG = [w ? 'Quité ' + esc(w.name) : '', false]; return renderAll(false); }
  if (act === 'timer') return openTimer();
  if (act === 'tclose') { $('tover').hidden = true; return; }
  if (act === 'tset') return tSet(+ds.s);
  if (act === 'tgo') return tToggle();
  if (act === 'tadd') return tAdd(+ds.s);
  if (act === 'meal') {
    const d = today(), st = MLOG[d] = MLOG[d] || {}; st[ds.k] = st[ds.k] === ds.v ? undefined : ds.v; store('fm-meals', MLOG); return renderAll(false);
  }
  if (act === 'undoadj') {
    const last = ADJ.hist.pop();
    if (last) ADJ[last.type] = Math.max(0, ADJ[last.type] - 1); else { ADJ.alm = 0; ADJ.cena = 0; }
    store('fm-adj', ADJ); return renderAll(false);
  }
  if (act === 'weak') { if (ADJ.alm < 2) { ADJ.alm++; ADJ.hist.push({date: today(), type: 'alm', msg: 'Te sentiste flojo: más carbohidratos en el almuerzo'}); store('fm-adj', ADJ); PROG_MSG = ['Listo: el almuerzo ahora lleva ¼ más de carbohidratos.', false]; } else PROG_MSG = ['Ya tenés el máximo de carbohidratos en el almuerzo. Si seguís flojo, revisá el sueño.', false]; return renderAll(false); }
  if (act === 'addw') {
    const kg = Number(String($('wkg').value).replace(',', '.')), waist = Number(String($('wwaist').value).replace(',', '.')) || null, date = $('wdate').value || today();
    if (!kg || kg < 40 || kg > 200) { PROG_MSG = ['Poné tu peso en kg, por ejemplo 93,4.', true]; return renderAll(false); }
    WEIGHTS = WEIGHTS.filter(x => x.date !== date); WEIGHTS.push({date, kg, waist}); store('fm-weights', WEIGHTS);
    const ch = evaluateAdj(); PROG_MSG = [ch ? 'Guardado. Ajusté tu dieta: ' + ch + '.' : 'Guardado.', false]; return renderAll(false);
  }
  if (act === 'delw') { WEIGHTS = WEIGHTS.filter(x => x.date !== ds.date); store('fm-weights', WEIGHTS); PROG_MSG = ['', false]; return renderAll(false); }
  if (act === 'cm') { const ta = $('cdesc'); if (ta) CDESC = ta.value; CM = ds.k; return renderCalc(); }
  if (act === 'cgo') return runCalc();
  if (act === 'crm') { CIMG = null; return renderCalc(); }
  if (act === 'editkey') { CEDITKEY = true; CMSG = ['', false]; return renderCalc(); }
  if (act === 'cancelkey') { CEDITKEY = false; return renderCalc(); }
  if (act === 'savekey') {
    const k = ($('orkey').value || '').trim();
    if (!/^sk-or-/.test(k)) { CMSG = ['Esa no parece una clave de OpenRouter (empieza con sk-or-).', true]; return renderCalc(); }
    setKey(k); CEDITKEY = false; CMSG = ['Listo, clave guardada en este celular.', false]; return renderCalc();
  }
  if (act === 'addcalc' && CRES) {
    const m = calcMacros(CRES.r), d = today();
    (CLOG[d] = CLOG[d] || []).push({meal: CRES.m, plato: CRES.r.plato || 'Plato', gramos: m.g, kcal: Math.round(m.kcal), p: Math.round(m.p)}); store('fm-calclog', CLOG);
    CADDED = true; return renderCalc();
  }
  if (act === 'shopreset') { delete SHOP[weekStart(today())]; store('fm-shop', SHOP); return renderAll(false); }
  if (act === 'update') { location.replace(location.pathname + '?v=' + encodeURIComponent(ds.v)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.exin) { const b = e.target.parentNode.querySelector('button'); b && b.click(); } });
document.addEventListener('input', e => { if (e.target.id === 'cdesc') CDESC = e.target.value; });
document.addEventListener('change', async e => {
  if (e.target.id === 'xfile') { const f = e.target.files && e.target.files[0]; if (f) importExcel(f); return; }
  if (e.target.dataset && e.target.dataset.shop) {
    const wk = weekStart(today()), s = SHOP[wk] = SHOP[wk] || {}; s[e.target.dataset.shop] = e.target.checked; store('fm-shop', SHOP);
    e.target.closest('.shop').classList.toggle('got', e.target.checked); return;
  }
  if (e.target.id === 'cfile') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const ta = $('cdesc'); if (ta) CDESC = ta.value;
    try { CIMG = await shrinkImg(f); } catch (err) { CMSG = ['No pude leer la foto.', true]; }
    renderCalc();
  }
});
